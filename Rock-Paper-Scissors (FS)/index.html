<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="scoreboard">
            <div class="score">User: <span id="user-score">0</span></div>
            <div class="score">Computer: <span id="comp-score">0</span></div>
        </div>

        <div class="choices">
            <button id="rock" class="choice-btn">🪨 Rock</button>
            <button id="paper" class="choice-btn">📄 Paper</button>
            <button id="scissors" class="choice-btn">✂️ Scissors</button>
        </div>

        <div class="result-area">
            <p id="message">Make your move!</p>
            <p id="sub-message">First to 5 wins?</p>
        </div>

        <button id="reset-btn">Reset Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
